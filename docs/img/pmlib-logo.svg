<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 190" width="200" height="190">
  <title>PMLib</title>

  <!-- Gauge housing ends -->
  <rect x="21" y="108" width="18" height="16" rx="2" fill="#c0392b"/>
  <rect x="161" y="108" width="18" height="20" rx="2" fill="#1a5c1a"/>

  <!-- Gauge arc: four 45-degree bands from red (left) to dark green (right) -->
  <path d="M 30 110 A 70 70 0 0 1 50.5 60.5" fill="none" stroke="#e74c3c" stroke-width="22"/>
  <path d="M 50.5 60.5 A 70 70 0 0 1 100 40" fill="none" stroke="#e0a020" stroke-width="22"/>
  <path d="M 100 40 A 70 70 0 0 1 149.5 60.5" fill="none" stroke="#7ec850" stroke-width="22"/>
  <path d="M 149.5 60.5 A 70 70 0 0 1 170 110" fill="none" stroke="#1a5c1a" stroke-width="22"/>

  <!-- Thin outer rim -->
  <path d="M 19 110 A 81 81 0 0 1 181 110" fill="none" stroke="#1a5c1a" stroke-width="2"/>

  <!-- Needle -->
  <polygon points="100,120 128,52 106,120" fill="#4a4a4a"/>
  <circle cx="100" cy="120" r="9" fill="#4a4a4a"/>

  <!-- Wordmark -->
  <text x="100" y="176" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-weight="800" font-size="52">
    <tspan fill="#1a5c1a">PM</tspan><tspan fill="#2255aa">Lib</tspan>
  </text>
</svg>
